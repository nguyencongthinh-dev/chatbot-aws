    <script>
        function parseMarkdown(text) {
            if (!text) return 'Content not available';

            let html = text;

            // Escape HTML first to prevent XSS
            html = html.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Headers (must be before other replacements)
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Horizontal rules
            html = html.replace(/^---$/gm, '<hr>');
            html = html.replace(/^\*\*\*$/gm, '<hr>');

            // Bold and italic (must be before links)
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');

            // Inline code (before code blocks)
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Code blocks
            html = html.replace(/```[\s\S]*?```/g, function (match) {
                const code = match.replace(/```(\w*)\n?/, '').replace(/```$/, '');
                return '<pre><code>' + code + '</code></pre>';
            });

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

            // Blockquotes
            html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

            // Tables
            const tableRegex = /(\|.+\|[\r\n]+)+/g;
            html = html.replace(tableRegex, function (match) {
                const lines = match.trim().split(/[\r\n]+/);
                if (lines.length < 2) return match;

                let tableHtml = '<table>';

                // Header
                const headers = lines[0].split('|').filter(c => c.trim());
                tableHtml += '<thead><tr>';
                headers.forEach(h => tableHtml += `<th>${h.trim()}</th>`);
                tableHtml += '</tr></thead><tbody>';

                // Rows (skip separator)
                for (let i = 1; i < lines.length; i++) {
                    if (/^[\|\-\:\s]+$/.test(lines[i])) continue;
                    const cells = lines[i].split('|').filter(c => c.trim());
                    if (cells.length === 0) continue;
                    tableHtml += '<tr>';
                    cells.forEach(c => tableHtml += `<td>${c.trim()}</td>`);
                    tableHtml += '</tr>';
                }
                tableHtml += '</tbody></table>';
                return tableHtml;
            });

            // Unordered lists
            html = html.replace(/^\* (.+)$/gm, '<li>$1</li>');
            html = html.replace(/^- (.+)$/gm, '<li>$1</li>');

            // Ordered lists
            html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

            // Wrap lists
            html = html.replace(/(<li>.*?<\/li>\n?)+/g, '<ul>$&</ul>');

            // Paragraphs
            const lines = html.split('\n');
            let inBlock = false;
            let result = [];
            let paragraph = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.match(/^<(h[123]|ul|ol|table|pre|blockquote|hr)/)) {
                    if (paragraph.length > 0) {
                        result.push('<p>' + paragraph.join(' ') + '</p>');
                        paragraph = [];
                    }
                    result.push(line);
                    inBlock = true;
                } else if (line.match(/<\/(h[123]|ul|ol|table|pre|blockquote)>/)) {
                    result.push(line);
                    inBlock = false;
                } else if (inBlock) {
                    result.push(line);
                } else if (line === '') {
                    if (paragraph.length > 0) {
                        result.push('<p>' + paragraph.join(' ') + '</p>');
                        paragraph = [];
                    }
                } else {
                    paragraph.push(line);
                }
            }

            if (paragraph.length > 0) {
                result.push('<p>' + paragraph.join(' ') + '</p>');
            }

            return result.join('\n');
        }

        function parse() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            const parsed = parseMarkdown(input);
            output.innerHTML = parsed;
        }

        // Auto-parse on load
        window.onload = () => parse();
    </script>
